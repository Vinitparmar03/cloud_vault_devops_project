apiVersion: v1
kind: ConfigMap
metadata:
  name: env-config
data:
  PORT_GATEWAY: "8000"
  PORT_USER_SERVICE: "5001"
  PORT_VAULT_SERVICE: "5002"
  CLIENT_URL: http://vault.local.com
  VAULT_SERVICE: "http://vault-service:5002"
  USER_SERVICE: "http://user-service:5001"
  NODE_OPTIONS: "--network-family-autoselection-attempt-timeout=1000"